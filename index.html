<!doctype html>
<html lang="ko" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>BowTie 분석기 · 보우타이 위험성 평가</title>
<meta name="description" content="위협·장벽·결과를 클릭 몇 번으로 그리는 보우타이(Bow-tie) 위험성 평가 도구. 자동 저장, 엑셀·PDF·이미지 내보내기, 링크 공유.">
<meta property="og:title" content="BowTie 분석기">
<meta property="og:description" content="보우타이(Bow-tie) 위험성 평가 다이어그램을 쉽고 빠르게">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M6 9v14l8-7zM26 9v14l-8-7z' fill='white'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23ff922b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ================= 디자인 토큰 ================= */
:root{
  --font: Pretendard, 'Pretendard Variable', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif;
  --bg:#f2f4f7; --dot:#d7dde5; --panel:#ffffff; --panel2:#f7f8fa; --line:#e5e8ee; --line2:#d3d9e1;
  --text:#18212c; --text2:#525e6d; --text3:#8a94a3;
  --accent:#3b5bdb; --accent-h:#3049c4; --accent-soft:#edf1ff; --ring:rgba(59,91,219,.22);
  --threat:#1971c2; --threat-soft:#eef5fc; --cons:#c92a2a; --cons-soft:#fdf0f0;
  --top:#f76707; --top-ring:rgba(247,103,7,.13); --ef:#e8890c; --ef-soft:#fff6e5;
  --node:#ffffff; --wire:#98a2b3; --threat-line:#93bde6; --cons-line:#eba3a3; --crit-line:#f2b733;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  --shadow-lg:0 12px 32px -8px rgba(16,24,40,.22),0 4px 10px -4px rgba(16,24,40,.08);
  --r:10px; --topbar:58px; --insp:340px;
  --tw:176px; --nw:150px; --nh:80px; --fs:13px;
  color-scheme: light;
}
[data-theme="dark"]{
  --bg:#0e1116; --dot:#262c35; --panel:#161b22; --panel2:#1c222b; --line:#29303a; --line2:#353e4a;
  --text:#e7ebf0; --text2:#a7b1bd; --text3:#6f7b89;
  --accent:#6c8cff; --accent-h:#829dff; --accent-soft:#1d2645; --ring:rgba(108,140,255,.28);
  --threat:#4dabf7; --threat-soft:#13263a; --cons:#ff6b6b; --cons-soft:#361a1d;
  --top:#ff922b; --top-ring:rgba(255,146,43,.16); --ef:#fcc419; --ef-soft:#33290f;
  --node:#1c222b; --wire:#4f5a68; --threat-line:#2d5d8a; --cons-line:#7c3a3e; --crit-line:#b8860b;
  --shadow:0 1px 2px rgba(0,0,0,.35); --shadow-lg:0 16px 40px -8px rgba(0,0,0,.6);
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:var(--font);color:var(--text);background:var(--panel);font-size:14px;-webkit-font-smoothing:antialiased;overflow:hidden;letter-spacing:-.005em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
button:disabled{cursor:default;opacity:.4}
.i{width:16px;height:16px;flex:none;display:inline-block;vertical-align:middle}
kbd{font-family:inherit;font-size:11px;font-weight:600;padding:1px 6px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:5px;background:var(--panel);color:var(--text2);white-space:nowrap}
code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;background:var(--panel2);border:1px solid var(--line);padding:1px 5px;border-radius:5px}
[hidden]{display:none!important}

/* ================= 버튼 · 입력 ================= */
.btn{height:34px;padding:0 12px;border-radius:9px;border:1px solid var(--line2);background:var(--panel);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;transition:background .12s,border-color .12s,color .12s}
.btn:hover:not(:disabled){background:var(--panel2);border-color:var(--text3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--accent-h);border-color:var(--accent-h)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--text2)}
.btn.ghost:hover{background:var(--panel2)}
.btn.danger{color:#e03131}
.btn.danger:hover{background:rgba(224,49,49,.08);border-color:#e03131}
.btn.danger-fill{background:#e03131;border-color:#e03131;color:#fff}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px;border-radius:8px}
.btn.wide{width:100%;justify-content:center;margin-top:8px}
.ibtn{width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;color:var(--text2);transition:background .12s,color .12s}
.ibtn:hover:not(:disabled){background:var(--panel2);color:var(--text)}
.ibtn.sm{width:28px;height:28px;border-radius:7px}
.ibtn.danger:hover{color:#e03131;background:rgba(224,49,49,.08)}
.mini{font-size:11.5px;font-weight:600;color:var(--accent);padding:2px 6px;border-radius:6px;display:inline-flex;align-items:center;gap:3px}
.mini:hover{background:var(--accent-soft)}
.mini .i{width:12px;height:12px}
.inp{width:100%;height:34px;padding:0 10px;border:1px solid var(--line2);border-radius:8px;background:var(--panel);font-size:13px;outline:none;transition:border-color .12s,box-shadow .12s}
.inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring)}
.inp.sm{height:30px;font-size:12.5px;padding:0 6px}
textarea.inp{height:auto;padding:8px 10px;resize:vertical;line-height:1.5}
.inp.mono{font-family:ui-monospace,SFMono-Regular,Consolas,'D2Coding',monospace;font-size:12.5px;line-height:1.65}
select.inp{padding-right:4px}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text2);cursor:pointer;white-space:nowrap}
.chk input{accent-color:var(--accent);width:15px;height:15px}
.sp{flex:1}
.note{font-size:12.5px;color:var(--text3);line-height:1.6}
.lead{font-size:13.5px;color:var(--text2);line-height:1.65;margin:0 0 16px}
.empty{font-size:12.5px;color:var(--text3);padding:8px 2px}
.hintline{font-size:12px;color:var(--text3);margin-top:8px;line-height:1.5}
.cnt{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:18px;padding:0 6px;border-radius:99px;background:var(--panel2);border:1px solid var(--line);font-size:11px;font-weight:700;color:var(--text2);margin-left:4px}

/* ================= 상단바 ================= */
.topbar{height:var(--topbar);display:flex;align-items:center;gap:14px;padding:0 14px;border-bottom:1px solid var(--line);background:var(--panel);position:relative;z-index:20}
.tb-left{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 auto}
.brand{display:flex;align-items:center;gap:9px;flex:none}
.logo{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,#3b5bdb,#5f3dc4);display:flex;align-items:center;justify-content:center;color:#fff;box-shadow:0 2px 6px rgba(59,91,219,.35)}
.logo .i{width:19px;height:19px;stroke-width:2.2}
.bname{font-weight:800;font-size:15.5px;letter-spacing:-.02em;white-space:nowrap}
.bname b{font-weight:600;color:var(--text3);margin-left:5px;font-size:13.5px}
.tdiv{width:1px;height:22px;background:var(--line);flex:none}
.ptitle{min-width:80px;max-width:340px;width:100%;height:34px;border:1px solid transparent;border-radius:8px;padding:0 9px;font-size:14.5px;font-weight:700;background:transparent;outline:none;text-overflow:ellipsis}
.ptitle:hover{border-color:var(--line2)}
.ptitle:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);background:var(--panel)}
.savestate{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--text3);white-space:nowrap;flex:none}
.savestate .i{width:13px;height:13px;color:#2f9e44}
.savestate[data-s="error"]{color:#e03131}.savestate[data-s="error"] .i{color:#e03131}
.savestate .dot{width:6px;height:6px;border-radius:50%;background:#f59f00;display:inline-block}
.tabs{display:flex;gap:2px;background:var(--panel2);padding:3px;border-radius:11px;border:1px solid var(--line);flex:none}
.tab{height:30px;padding:0 13px;border-radius:8px;font-weight:600;font-size:13px;color:var(--text2);display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.tab:hover{color:var(--text)}
.tab.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
[data-theme="dark"] .tab.on{background:var(--line)}
.tb-right{display:flex;align-items:center;gap:6px;flex:none;justify-content:flex-end}
.only-narrow{display:none}
.only-mobile{display:none}

/* ================= 레이아웃 ================= */
.main{display:flex;height:calc(100% - var(--topbar));position:relative}
.work{flex:1;min-width:0;position:relative;background:var(--bg)}
.view{display:none;position:absolute;inset:0}
.view.on{display:block}
#tableView.on{display:flex;flex-direction:column}
#matrixView.on{overflow:auto}

/* ================= 캔버스 ================= */
.canvas{overflow:hidden;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.2px);background-size:22px 22px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
.canvas.panning{cursor:grabbing}
.ctools{position:absolute;z-index:6;display:flex;align-items:center;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:5px;box-shadow:var(--shadow);cursor:default}
.ctools.tl{left:14px;top:12px}
.ctools.bl{left:14px;bottom:14px}
.ctools .btn{height:30px;font-size:12.5px;padding:0 10px;border-radius:8px}
.ctools .ibtn{width:30px;height:30px;border-radius:8px}
.zoompct{min-width:48px;text-align:center;font-size:12px;font-weight:700;color:var(--text2);border-radius:7px;height:30px}
.zoompct:hover{background:var(--panel2)}
.sbox{position:relative;display:flex;align-items:center}
.sbox .i{position:absolute;left:9px;color:var(--text3);width:14px;height:14px;pointer-events:none}
.sbox .inp{padding-left:30px;height:30px;width:190px;font-size:12.5px}
.scnt{position:absolute;right:8px;font-size:11px;font-weight:700;color:var(--accent);pointer-events:none}
.hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:5;display:flex;align-items:center;gap:8px;max-width:calc(100% - 300px);background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:6px 8px 6px 14px;font-size:12px;color:var(--text2);box-shadow:var(--shadow);cursor:default;white-space:nowrap;overflow:hidden}
.hint .ht{overflow:hidden;text-overflow:ellipsis}
.hint b{color:var(--text);font-weight:700}
.hint .ibtn{width:22px;height:22px;border-radius:50%}
.hint .ibtn .i{width:13px;height:13px}

/* ================= 스테이지 · 보우타이 ================= */
.stage{position:absolute;left:0;top:0;transform-origin:0 0;padding:40px 48px 48px;width:max-content;cursor:default}
.stage.ns-s{--tw:150px;--nw:126px;--nh:72px;--fs:12px}
.stage.ns-l{--tw:206px;--nw:176px;--nh:90px;--fs:14px}
.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:0}
.wires path{fill:none;stroke:var(--wire);stroke-width:2.2;stroke-linecap:round}
.wires path.on{stroke:var(--accent);stroke-width:2.8}
.wires path.hz{stroke-dasharray:0}
.wires .arr{fill:var(--wire)}
.wires .arr.on{fill:var(--accent)}
.titleblock{display:inline-flex;flex-direction:column;gap:5px;padding:12px 18px;margin-bottom:30px;background:var(--panel);border:1px solid var(--line);border-radius:12px;position:relative;z-index:1}
.tb-title{font-size:19px;font-weight:800;letter-spacing:-.02em}
.tb-meta{display:flex;flex-wrap:wrap;gap:4px 16px}
.tb-meta span{font-size:12px;color:var(--text2)}
.bowtie{display:flex;align-items:center;position:relative;z-index:1}
.side{display:flex;flex-direction:column;gap:12px}
.side-head{display:flex;align-items:baseline;gap:8px;padding:0 4px 2px}
.side-R .side-head{justify-content:flex-end}
.sh-t{font-size:16px;font-weight:800;letter-spacing:-.02em}
.side-L .sh-t{color:var(--threat)}.side-R .sh-t{color:var(--cons)}
.sh-s{font-size:11.5px;color:var(--text3);font-weight:600}
.rows{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:flex-start;position:relative;border-radius:14px}
.row::before{content:"";position:absolute;inset:-6px -8px;border-radius:14px;background:transparent;transition:background .15s;z-index:-1;pointer-events:none}
.row:hover::before{background:rgba(59,91,219,.035)}
.row.drop-row::before{background:var(--accent-soft);outline:2px dashed var(--accent)}
.fill{flex:1;min-width:46px}
.cell{display:flex;flex-direction:column;align-items:center;flex:none}
.ins{width:20px;height:var(--nh);display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;position:relative;z-index:2}
.ins span{width:18px;height:18px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;opacity:0;transform:scale(.5);transition:opacity .12s,transform .12s;box-shadow:0 0 0 3px var(--bg)}
.ins span .i{width:12px;height:12px;stroke-width:3}
.row:hover .ins span{opacity:.55;transform:scale(.75)}
.ins:hover span{opacity:1!important;transform:scale(1)!important}
.add-cell{width:52px;height:var(--nh);justify-content:center}
.add-b{width:28px;height:28px;border-radius:50%;border:1.5px dashed var(--line2);background:var(--panel);color:var(--text3);display:flex;align-items:center;justify-content:center;transition:all .12s;position:relative;z-index:2}
.add-b:hover{border-style:solid;border-color:var(--accent);color:#fff;background:var(--accent);transform:scale(1.1)}
.add-b .i{width:15px;height:15px;stroke-width:2.5}
.add-row{align-self:flex-start;width:var(--tw);height:38px;border:1.5px dashed var(--line2);border-radius:10px;color:var(--text3);font-weight:600;font-size:12.5px;display:flex;align-items:center;justify-content:center;gap:6px;background:color-mix(in srgb,var(--panel) 70%,transparent);transition:all .12s;margin-top:4px}
.side-R .add-row{align-self:flex-end}
.add-row:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.center{display:flex;flex-direction:column;align-items:center;padding:0 78px;flex:none;gap:36px}

/* ---------- 노드 공통 ---------- */
.node{position:relative;background:var(--node);border:1.5px solid var(--line2);border-radius:var(--r);box-shadow:var(--shadow);cursor:pointer;transition:box-shadow .12s,border-color .12s,opacity .15s}
.node:hover{border-color:var(--text3)}
.node.sel,.hz-frame.sel .node{box-shadow:0 0 0 3.5px var(--ring),var(--shadow-lg);z-index:4}
.node.sel{border-color:var(--accent)}
.node.dragging{opacity:.35}
.node .label{font-size:var(--fs);line-height:1.38;font-weight:650;color:var(--text);word-break:keep-all;overflow-wrap:anywhere;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;outline:none}
.node.editing{z-index:6;cursor:text}
.node.editing .label{display:block;-webkit-line-clamp:unset;overflow:visible;user-select:text;-webkit-user-select:text;cursor:text;background:var(--accent-soft);border-radius:5px;box-shadow:0 0 0 2px var(--accent);padding:1px 3px;margin:-1px -3px;min-height:1.4em}
.acc{position:absolute;left:5px;top:9px;bottom:9px;width:4px;border-radius:3px;background:var(--line2)}
.num{font-size:10px;font-weight:800;color:var(--text3);letter-spacing:.02em}
.ntools{display:none;position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px;gap:1px;box-shadow:var(--shadow-lg);z-index:8;white-space:nowrap}
.node.sel>.ntools,.hz-frame.sel .ntools{display:flex}
.node.editing>.ntools{display:none!important}
.ntools button{width:28px;height:28px;border-radius:7px;color:var(--text2);display:flex;align-items:center;justify-content:center}
.ntools button:hover{background:var(--panel2);color:var(--accent)}
.ntools button[data-tool="del"]:hover{color:#e03131}
.ntools .i{width:15px;height:15px}

/* 위협 · 결과 */
.node.threat,.node.cons{width:var(--tw);height:var(--nh);padding:9px 12px 9px 17px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.node.threat{border-color:var(--threat-line);background:var(--threat-soft)}
.node.threat .acc{background:var(--threat)}
.node.cons{border-color:var(--cons-line);background:var(--cons-soft)}
.node.cons .acc{background:var(--cons)}
.node.cons.has-risk .label{-webkit-line-clamp:2}
.node.threat.sel,.node.cons.sel{border-color:var(--accent)}
.node .num.xs{position:absolute;top:-9px;left:10px;background:var(--panel);border:1px solid var(--line2);border-radius:6px;padding:0 5px;line-height:15px}
.risk{align-self:flex-start;display:inline-flex;padding:1px 7px;border-radius:6px;background:var(--rcs);border:1px solid var(--rc)}
.risk span{font-size:10.5px;font-weight:700;color:var(--rc);white-space:nowrap}
[data-theme="dark"] .risk span{filter:brightness(1.25)}

/* 장벽 */
.node.barrier{width:var(--nw);height:var(--nh);padding:7px 9px 7px 15px;display:flex;flex-direction:column;gap:2px}
.node.barrier .acc{background:var(--tc)}
.nb-head{display:flex;align-items:center;gap:5px;min-height:17px}
.nb-head .num{flex:none}
.tname{font-size:10.5px;font-weight:700;color:var(--tc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.eff{flex:none;display:inline-flex;align-items:center;padding:0 6px;height:16px;border-radius:99px;background:var(--ecs);border:1px solid var(--ec)}
.eff span{font-size:10px;font-weight:700;color:var(--ec);line-height:1}
[data-theme="dark"] .eff span{filter:brightness(1.3)}
.crit{font-size:12px;color:#f59f00;line-height:1;flex:none}
.stw{flex:none;width:15px;height:15px;border-radius:50%;background:#fd7e14;display:inline-flex;align-items:center;justify-content:center}
.stw span{color:#fff;font-size:10px;font-weight:900;line-height:1}
.node.barrier .label{-webkit-line-clamp:2;flex:1}
.node.barrier.nofoot .label{-webkit-line-clamp:3}
.nb-foot{font-size:10.5px;color:var(--text3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600}
.node.barrier.critical{border-width:2px;border-color:var(--crit-line)}
.node.barrier.critical.sel{border-color:var(--accent)}
.node.barrier.st-missing{border-style:dashed;opacity:.72}
.node.barrier.st-warn{border-color:#fd7e14}

/* 상승요인 */
.efs{display:flex;flex-direction:column;align-items:center}
.ef-wrap{display:flex;flex-direction:column;align-items:center}
.ef-link{width:0;height:16px;border-left:2px dashed var(--ef)}
.node.ef{width:calc(var(--nw) - 6px);padding:6px 10px 7px;background:var(--ef-soft);border:1.5px dashed var(--ef);border-radius:9px}
.node.ef .label{font-size:calc(var(--fs) - 1px);-webkit-line-clamp:2}
.ef-tag{display:block;font-size:9.5px;font-weight:800;color:var(--ef);letter-spacing:.02em;margin-bottom:1px}
.efb-list{display:flex;flex-direction:column;align-items:center}
.efb-link{width:0;height:10px;border-left:2px solid var(--ef)}
.node.barrier.efb{width:calc(var(--nw) - 14px);height:auto;min-height:48px;padding:5px 8px 6px 14px}
.node.barrier.efb .label{font-size:calc(var(--fs) - 1px);-webkit-line-clamp:2}
.add-efb{margin-top:7px;height:24px;padding:0 9px;border-radius:7px;border:1px dashed var(--ef);color:var(--ef);font-size:11px;font-weight:700;display:inline-flex;align-items:center;gap:3px;background:var(--panel);opacity:.55;transition:opacity .12s}
.add-efb .i{width:12px;height:12px}
.row:hover .add-efb,.add-efb:hover{opacity:1}

/* 위험요인 · 정상 사건 */
.hz-frame{padding:6px;border-radius:13px;background:repeating-linear-gradient(-45deg,#1f2328 0 8px,#ffd43b 8px 16px);box-shadow:var(--shadow);position:relative;transition:box-shadow .12s}
.hz-frame.sel{box-shadow:0 0 0 3.5px var(--ring),var(--shadow-lg)}
.node.hazard{width:188px;min-height:62px;padding:8px 12px;border:0;border-radius:8px;text-align:center;box-shadow:none;display:flex;flex-direction:column;justify-content:center;gap:2px}
.hz-tag{font-size:10px;font-weight:800;color:var(--text3);letter-spacing:.03em}
.node.hazard .label{font-size:calc(var(--fs) + .5px)}
.hz-frame .ntools{top:-44px}
.node.top{width:172px;height:172px;border-radius:50%;border:8px solid var(--top);box-shadow:0 0 0 8px var(--top-ring),var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:16px 18px;gap:4px}
.node.top:hover{border-color:var(--top)}
.node.top.sel{border-color:var(--top);box-shadow:0 0 0 8px var(--top-ring),0 0 0 12px var(--ring),var(--shadow-lg)}
.top-tag{font-size:10.5px;font-weight:800;color:var(--top);letter-spacing:.04em}
.node.top .label{font-size:calc(var(--fs) + 1.5px);font-weight:750;-webkit-line-clamp:4}
.node.top .ntools{top:-46px}

/* 범례 */
.legend{display:flex;flex-wrap:wrap;gap:8px 26px;margin-top:34px;padding:11px 16px;background:var(--panel);border:1px solid var(--line);border-radius:12px;width:max-content;max-width:100%;position:relative;z-index:1}
.lg-g{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.lg-h{font-size:11.5px;font-weight:800;color:var(--text2);margin-right:2px}
.lg-i{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text2)}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.sw.round{border-radius:50%}
.sw-ef{background:var(--ef-soft);border:1.5px dashed var(--ef)}
.sw-miss{background:var(--node);border:1.5px dashed var(--text3)}
.lg-star{color:#f59f00;font-size:12px}

/* 드래그 표시 */
.node.drop-before::after,.node.drop-after::after,.node.drop-above::after,.node.drop-below::after{content:"";position:absolute;background:var(--accent);border-radius:3px;box-shadow:0 0 0 2px var(--bg)}
.node.drop-before::after{left:-13px;top:4px;bottom:4px;width:4px}
.node.drop-after::after{right:-13px;top:4px;bottom:4px;width:4px}
.node.drop-above::after{top:-12px;left:6px;right:6px;height:4px}
.node.drop-below::after{bottom:-12px;left:6px;right:6px;height:4px}
.node.drop-into{box-shadow:0 0 0 3px var(--accent)}

/* 검색 */
.stage.searching .node:not(.hit){opacity:.25}
.stage.searching .hz-frame:not(:has(.hit)){opacity:.35}
.node.hit{box-shadow:0 0 0 3px #fab005,var(--shadow-lg)}

/* 내보내기 중 */
.stage.exporting .noexport{visibility:hidden!important}
.stage.exporting .row::before{display:none}

/* ================= 자동완성 · 메뉴 · 토스트 ================= */
.suggest{position:fixed;z-index:60;width:260px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:5px;display:none}
.suggest.on{display:block}
.sg-h{font-size:10.5px;font-weight:700;color:var(--text3);padding:4px 8px 5px}
.sg-i{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:8px;font-size:13px;cursor:pointer}
.sg-i span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sg-i b{color:var(--accent)}
.sg-i em{font-style:normal;font-size:10.5px;font-weight:700;flex:none}
.sg-i:hover,.sg-i.on{background:var(--accent-soft)}
.ctx{position:fixed;z-index:95;min-width:230px;max-width:330px;background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow-lg);padding:5px;display:none}
.ctx.on{display:block;animation:pop .12s ease-out}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.mhd{font-size:11px;font-weight:800;color:var(--text3);padding:6px 9px 4px;letter-spacing:.02em}
.mitem{width:100%;display:flex;align-items:center;gap:9px;padding:7px 9px;border-radius:8px;font-size:13px;text-align:left}
.mitem:hover:not(:disabled){background:var(--panel2)}
.mitem .i{color:var(--text3)}
.mitem .ml{flex:1}
.mitem.danger{color:#e03131}.mitem.danger .i{color:#e03131}
.mitem.danger:hover{background:rgba(224,49,49,.08)}
.msep{height:1px;background:var(--line);margin:4px 3px}
.mchips{padding:5px 9px 6px}
.mlabel{display:block;font-size:11px;font-weight:700;color:var(--text3);margin-bottom:5px}
.mchips>div{display:flex;flex-wrap:wrap;gap:4px}
.mchip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;border:1px solid var(--line2);font-size:12px;font-weight:600}
.mchip i{width:7px;height:7px;border-radius:50%;background:var(--c)}
.mchip:hover{border-color:var(--c)}
.mchip.on{background:var(--cs);border-color:var(--c);color:var(--c)}
.toasts{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.toast{display:flex;align-items:center;gap:14px;background:#1f2630;color:#fff;padding:10px 16px;border-radius:11px;font-size:13px;box-shadow:var(--shadow-lg);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;pointer-events:auto;max-width:min(560px,92vw)}
[data-theme="dark"] .toast{background:#2b3440}
.toast.in{opacity:1;transform:none}
.toast.err{background:#c92a2a}
.toast button{color:#91a7ff;font-weight:700;font-size:13px;white-space:nowrap}
.dropzone{position:fixed;inset:12px;z-index:100;border:3px dashed var(--accent);border-radius:18px;background:color-mix(in srgb,var(--accent-soft) 85%,transparent);display:none;align-items:center;justify-content:center;font-size:18px;font-weight:700;color:var(--accent);pointer-events:none}
.dropzone.on{display:flex}

/* ================= 속성 패널 ================= */
.insp{width:var(--insp);flex:none;border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;position:relative;z-index:10}
body.insp-off .insp{display:none}
.insp-head{padding:14px 16px 12px;border-bottom:1px solid var(--line);position:relative;min-height:62px}
.ih-kind{font-size:15px;font-weight:800;display:flex;align-items:center;gap:6px}
.ih-kind b{font-size:11px;font-weight:800;color:var(--text3);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.ih-kind.k-threat{color:var(--threat)}.ih-kind.k-cons{color:var(--cons)}.ih-kind.k-top{color:var(--top)}.ih-kind.k-ef{color:var(--ef)}
.ih-loc{font-size:12px;color:var(--text3);margin-top:3px;padding-right:30px;line-height:1.45}
.ih-x{position:absolute;right:10px;top:12px}
.insp-body{flex:1;overflow-y:auto;padding:4px 16px 30px;scrollbar-width:thin}
.sec{padding:14px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-t{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:800;margin-bottom:10px}
.sec-t .i{width:15px;height:15px;color:var(--text3)}
.sec-t .mini{margin-left:auto}
.fld{margin-bottom:12px}
.fld:last-child{margin-bottom:0}
.fl{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:var(--text2);margin-bottom:6px}
.fl .mini{margin-left:auto}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid2 .fld{margin-bottom:0}
.sec .grid2+.fld{margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border-radius:99px;border:1px solid var(--line2);font-size:12.5px;font-weight:600;color:var(--text2);background:var(--panel);transition:all .1s}
.chip .dot{width:8px;height:8px;border-radius:50%;background:var(--c)}
.chip:hover{border-color:var(--c);color:var(--text)}
.chip.on{background:var(--cs);border-color:var(--c);color:var(--c);font-weight:750}
[data-theme="dark"] .chip.on{filter:brightness(1.2)}
.newrow{display:flex;gap:6px;margin-top:8px}
.newrow .inp{height:30px}
.toggle{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--text2);cursor:pointer;margin-top:12px;line-height:1.4}
.toggle input{display:none}
.toggle>span{width:34px;height:20px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:background .15s}
.toggle>span::after{content:"";position:absolute;left:3px;top:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
.toggle input:checked+span{background:var(--accent)}
.toggle input:checked+span::after{transform:translateX(14px)}
.toggle.row{padding:10px 0;margin:0;border-bottom:1px solid var(--line)}
.toggle.row b{display:block;color:var(--text);font-size:13px}
.toggle.row small{display:block;color:var(--text3);font-size:12px;margin-top:2px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.blist{display:flex;flex-direction:column;gap:3px}
.bli{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;text-align:left;font-size:12.5px;border:1px solid transparent}
.bli:hover{background:var(--panel2);border-color:var(--line)}
.bli i{width:9px;height:9px;border-radius:50%;flex:none}
.bli.ef i{background:var(--ef);border-radius:2px}
.bli .bn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bli em{font-style:normal;font-size:10.5px;font-weight:700;flex:none;color:var(--text3)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:9px 10px}
.stat b{display:block;font-size:19px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:11.5px;color:var(--text3);font-weight:600}
.effbar{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;background:var(--panel2)}
.effbar i{display:block;height:100%}
.efflg{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:8px}
.efflg span{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--text2)}
.efflg i{width:8px;height:8px;border-radius:50%}
.warns{display:flex;flex-direction:column;gap:4px}
.warn{display:flex;align-items:flex-start;gap:8px;text-align:left;font-size:12.5px;line-height:1.45;padding:7px 9px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.warn:hover{border-color:var(--text3);background:var(--panel2)}
.warn i{width:8px;height:8px;border-radius:50%;margin-top:5px;flex:none}
.warn.lv-hi i{background:#e03131}.warn.lv-md i{background:#f08c00}.warn.lv-lo i{background:#adb5bd}
.okbox{display:flex;align-items:center;gap:8px;font-size:12.5px;color:#2f9e44;background:rgba(47,158,68,.08);border-radius:8px;padding:9px 11px}
.tips ul{margin:0;padding-left:17px;font-size:12.5px;color:var(--text2);line-height:1.7}
.sec.note{font-size:12.5px}
.rgrid{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:6px;align-items:center}
.rgrid .inp{height:30px;font-size:12px;padding:0 4px}
.rl{font-size:12px;font-weight:700;color:var(--text2)}
.rchip{display:inline-flex;align-items:center;justify-content:center;min-width:64px;height:24px;padding:0 8px;border-radius:7px;background:var(--cs);border:1px solid var(--c);color:var(--c);font-size:11.5px;font-weight:800;white-space:nowrap}
.rchip.none{--c:var(--text3);--cs:var(--panel2);font-weight:600}
.insp-backdrop{display:none}

/* ================= 장벽 목록 표 ================= */
.tv-bar{flex:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:14px 18px;background:var(--panel);border-bottom:1px solid var(--line)}
.tv-title{font-size:16px;font-weight:800;margin-right:6px}
.tv-bar .inp{width:auto;height:32px}
.tv-bar .sbox .inp{width:210px;height:32px}
.tv-sum{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:12px 18px 6px}
.pill{display:inline-flex;gap:6px;align-items:center;padding:3px 10px;border-radius:99px;background:var(--cs);border:1px solid var(--c);color:var(--c);font-size:12px;font-weight:700}
.tv-tip{margin-left:auto;font-size:12px;color:var(--text3)}
.tv-wrap{flex:1;min-height:0;overflow:auto;padding:6px 18px 40px}
table.tv{border-collapse:separate;border-spacing:0;width:100%;min-width:1180px;background:var(--panel);border:1px solid var(--line);border-radius:12px;font-size:12.5px}
.tv thead th:first-child{border-top-left-radius:11px}.tv thead th:last-child{border-top-right-radius:11px}
.tv th{position:sticky;top:-6px;z-index:2;background:var(--panel2);text-align:left;font-size:11.5px;font-weight:800;color:var(--text2);padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tv td{padding:3px 4px;border-bottom:1px solid var(--line);vertical-align:middle}
.tv tr:last-child td{border-bottom:0}
.tv td.num{font-size:11px;font-weight:800;color:var(--text3);padding-left:10px;white-space:nowrap}
.tv td.ctr{text-align:center}
.tv td.ctr input{accent-color:#f59f00;width:15px;height:15px}
.tv tr.grp td{background:var(--panel2);padding:8px 10px;font-size:12.5px}
.tv tr.grp .gk{font-size:10.5px;font-weight:800;color:#fff;border-radius:5px;padding:1px 6px;margin-right:8px}
.tv tr.grp-L .gk{background:var(--threat)}.tv tr.grp-R .gk{background:var(--cons)}
.tv tr.grp .gs{color:var(--text3);font-size:11.5px;margin:0 10px}
.tv tr.efbr td{background:color-mix(in srgb,var(--ef-soft) 55%,transparent)}
.tv td.nm{display:flex;flex-direction:column}
.efp{font-size:10.5px;color:var(--ef);font-weight:700;padding:3px 6px 0}
.cin{width:100%;min-width:70px;height:30px;border:1px solid transparent;border-radius:6px;background:transparent;padding:0 6px;font-size:12.5px;outline:none}
.cin:hover{border-color:var(--line2)}
.cin:focus{border-color:var(--accent);background:var(--panel);box-shadow:0 0 0 3px var(--ring)}
select.cin.csel{color:var(--c);font-weight:700;min-width:104px}
.tv select.cin{min-width:96px}
.tv td.acts{white-space:nowrap;padding-right:8px}
.tv td.empty{text-align:center;padding:40px}

/* ================= 위험 매트릭스 ================= */
.mv{display:grid;grid-template-columns:minmax(440px,1.1fr) minmax(420px,1fr);gap:16px;padding:18px;align-items:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.mv-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.mv-head h3{margin:0;font-size:16px;font-weight:800;margin-right:auto}
.mv-head h3 small{font-size:12px;color:var(--text3);font-weight:700;margin-left:4px}
.seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 11px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text2)}
.seg button.on{background:var(--panel);color:var(--text);box-shadow:var(--shadow)}
[data-theme="dark"] .seg button.on{background:var(--line)}
.mx-wrap{display:flex;gap:6px}
.mx{flex:1;display:grid;grid-template-columns:86px repeat(var(--n),minmax(0,1fr));gap:4px}
.mx-corner{display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-end;gap:2px;font-size:11px;font-weight:800;color:var(--text2);padding:4px 6px 0 0;text-align:right}
.mx-rl,.mx-cl{display:flex;flex-direction:column;justify-content:center;font-size:11px;color:var(--text3);line-height:1.3}
.mx-rl{padding-right:6px;text-align:right;align-items:flex-end}
.mx-cl{align-items:center;text-align:center;padding-top:4px}
.mx-rl b,.mx-cl b{font-size:13px;color:var(--text)}
.mx-c{min-height:74px;border-radius:9px;background:var(--cs);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);position:relative;padding:20px 4px 4px;display:flex}
.mx-v{position:absolute;top:4px;right:7px;font-size:11px;font-weight:800;color:var(--c)}
[data-theme="dark"] .mx-v{filter:brightness(1.3)}
.mx-chips{display:flex;flex-wrap:wrap;gap:3px;align-content:flex-start;width:100%}
.mx-chip{display:inline-flex;align-items:center;gap:4px;max-width:100%;padding:2px 6px;border-radius:6px;background:var(--panel);border:1px solid var(--line2);font-size:10.5px;font-weight:800;color:var(--cons);box-shadow:var(--shadow)}
.mx-chip span{font-weight:600;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:90px}
.mx-chip.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--ring)}
.mx-lg{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:14px;font-size:12px;color:var(--text2)}
.mx-lg span{display:inline-flex;align-items:center;gap:6px}
.mx-lg i{width:10px;height:10px;border-radius:3px}
table.rt{width:100%;border-collapse:collapse;font-size:12.5px}
.rt th{text-align:left;font-size:11px;font-weight:800;color:var(--text3);padding:6px 5px;border-bottom:1px solid var(--line);white-space:nowrap}
.rt td{padding:7px 5px;border-bottom:1px solid var(--line);vertical-align:middle}
.rt td.num{font-size:11px;font-weight:800;color:var(--text3)}
.rt tr.on td{background:var(--accent-soft)}
.rt .rsel{display:grid;grid-template-columns:1fr 1fr;gap:4px;margin-bottom:5px}
.rt .rsel .inp.sm{min-width:0;width:100%;height:28px;font-size:12px}
.rt td.rn{min-width:130px}
.rt td.rc{min-width:150px}
.rt .sub{font-size:11px;color:var(--text3)}
.linkish{font-weight:700;text-align:left}
.linkish:hover{color:var(--accent);text-decoration:underline}

/* ================= 모달 ================= */
.mwrap{position:fixed;inset:0;z-index:80;background:rgba(15,20,28,.38);backdrop-filter:blur(3px);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 16px;opacity:0;transition:opacity .15s}
.mwrap.in{opacity:1}
.modal{width:min(560px,100%);max-height:88vh;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-lg);transform:translateY(8px) scale(.99);transition:transform .15s}
.mwrap.in .modal{transform:none}
.modal.small{width:min(420px,100%)}
.modal.mid{width:min(620px,100%)}
.modal.wide{width:min(860px,100%)}
.modal.xwide{width:min(1060px,100%)}
.mhead{display:flex;align-items:center;padding:14px 14px 12px 20px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:16.5px;font-weight:800;flex:1;letter-spacing:-.02em}
.mbody{padding:18px 20px;overflow:auto;flex:1}
.mfoot{display:flex;align-items:center;gap:8px;justify-content:flex-end;padding:12px 16px;border-top:1px solid var(--line)}
.cmsg{margin:0;line-height:1.7;font-size:14px}
.tpl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.tpl{display:flex;flex-direction:column;align-items:flex-start;gap:5px;text-align:left;padding:14px 15px;border:1px solid var(--line);border-radius:13px;background:var(--panel);transition:all .12s}
.tpl:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--ring);transform:translateY(-1px)}
.tpl-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;margin-bottom:4px}
.tpl.blank .tpl-ic{background:var(--panel2);color:var(--text2)}
.tpl-t{font-weight:800;font-size:14px}
.tpl-d{font-size:12.5px;color:var(--text2);line-height:1.5}
.tpl-c{font-size:11.5px;color:var(--text3);font-weight:600;margin-top:auto;padding-top:4px}
.pl-bar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.plist{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.pi{display:flex;align-items:center;gap:4px;border:1px solid var(--line);border-radius:12px;padding:4px 6px 4px 4px}
.pi.cur{border-color:var(--accent);background:var(--accent-soft)}
.pi-main{flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:8px 10px;border-radius:9px;text-align:left;min-width:0}
.pi-main:hover{background:var(--panel2)}
.pi.cur .pi-main:hover{background:transparent}
.pi-t{font-weight:700;font-size:14px}
.pi-t em{font-style:normal;font-size:11px;color:var(--accent);font-weight:800;margin-left:6px}
.pi-s{font-size:12px;color:var(--text3)}
.tx{display:grid;grid-template-columns:1.25fr 1fr;gap:18px}
.tx-l{display:flex;flex-direction:column;gap:8px}
#txIn{min-height:440px;flex:1}
.txstat{font-size:12.5px;color:var(--text2)}
.txstat b{color:var(--accent)}
.txstat .bad{color:#e03131}
.syn{width:100%;border-collapse:collapse;font-size:12.5px;margin-bottom:14px}
.syn td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top;color:var(--text2)}
.syn td:first-child{white-space:nowrap;padding-right:10px}
.sharebox{display:flex;gap:8px;margin-bottom:10px}
.warnnote{color:#e8590c;margin-top:8px}
.set{display:grid;grid-template-columns:190px 1fr;gap:20px;min-height:460px}
.set-nav{display:flex;flex-direction:column;gap:2px;border-right:1px solid var(--line);padding-right:14px}
.set-nav button{display:flex;align-items:center;gap:9px;padding:9px 10px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text2);text-align:left}
.set-nav button:hover{background:var(--panel2);color:var(--text)}
.set-nav button.on{background:var(--accent-soft);color:var(--accent)}
.set-body h4{margin:0 0 6px;font-size:15px;font-weight:800}
.set-body>.note{margin:0 0 14px}
.slist{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.srow{display:flex;align-items:center;gap:6px}
.srow input[type=color]{width:34px;height:34px;border:1px solid var(--line2);border-radius:8px;padding:3px;background:var(--panel);cursor:pointer;flex:none}
.srow .inp{flex:1;min-width:0}
.srow select.inp{flex:none;width:auto}
.srow .use{font-size:11.5px;color:var(--text3);white-space:nowrap;min-width:64px;text-align:right}
.fieldrow .inp[data-k="options"]{flex:1.4}
.lblrow{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.lblrow b{width:18px;text-align:center;font-size:12px;color:var(--text3)}
.lvr{font-size:12px;color:var(--text3);white-space:nowrap}
.srow .inp.num{width:72px;flex:none}
.lvrange{font-size:12px;font-weight:700;color:var(--text2);min-width:110px;white-space:nowrap}
.help{display:grid;grid-template-columns:1fr 1fr;gap:28px}
.hl{margin:0;padding-left:18px;font-size:13px;color:var(--text2);line-height:1.75}
.hl b{color:var(--text)}
.c-hz{background:#ffd43b;color:#1f2328!important;padding:0 4px;border-radius:4px}
.c-top{color:var(--top)!important}.c-th{color:var(--threat)!important}.c-co{color:var(--cons)!important}.c-ef{color:var(--ef)!important}
table.keys{width:100%;border-collapse:collapse;font-size:12.5px}
.keys td{padding:6px 4px;border-bottom:1px solid var(--line);color:var(--text2)}
.keys td:first-child{white-space:nowrap;width:42%}

/* ================= 반응형 ================= */
@media (max-width:1760px){
  .tb-right .btn.lbl span{display:none}
  .tb-right .btn.lbl{padding:0 9px}
}
@media (max-width:1400px){
  .tb-right .btn:not(.keep) span{display:none}
  .tb-right .btn:not(.keep){padding:0 9px}
  .savestate .st-t{display:none}
}
@media (max-width:1180px){
  .tabs .tab span{display:none}
  .bname b{display:none}
  .savestate{display:none}
  .hint{display:none}
  :root{--insp:300px}
}
@media (max-width:900px){
  .only-narrow{display:inline-flex}
  .insp{position:fixed;right:0;top:var(--topbar);bottom:0;width:min(360px,92vw);transform:translateX(105%);transition:transform .2s;box-shadow:var(--shadow-lg);display:flex!important}
  body.insp-open .insp{transform:none}
  body.insp-open .insp-backdrop{display:block;position:fixed;inset:var(--topbar) 0 0 0;background:rgba(0,0,0,.2);z-index:9}
  .tb-right .tdiv,.tb-right [data-cmd="text"]{display:none}
  .bname{display:none}
  .mv{grid-template-columns:1fr}
  .tx,.help,.set{grid-template-columns:1fr}
  .set-nav{flex-direction:row;flex-wrap:wrap;border-right:0;border-bottom:1px solid var(--line);padding:0 0 10px}
  .ctools.tl .sbox .inp{width:120px}
}
@media (max-width:620px){
  .topbar{gap:6px;padding:0 8px}
  .ptitle,.savestate,.tb-left .tdiv{display:none}
  .tb-left{flex:none}
  .tabs{margin-right:auto}
  .tab{padding:0 9px}
  .tb-right{gap:2px}
  .tb-right [data-cmd="redo"],.tb-right [data-cmd="projects"],.tb-right [data-cmd="text"],.tb-right [data-cmd="settings"],.tb-right [data-cmd="theme"],.tb-right [data-cmd="help"]{display:none}
  .tb-right .btn{padding:0 9px}
  .tb-right .btn span{display:none}
  .only-mobile{display:inline-flex}
  .ctools.tl .sbox .inp{width:104px}
  .mbody{padding:14px}
  .mwrap{padding:12px 8px}
}
@media print{body{overflow:visible}}

</style>

<body>
<header class="topbar">
  <div class="tb-left">
    <div class="brand"><span class="logo"><i data-ic="bowtie"></i></span><span class="bname">BowTie<b>분석기</b></span></div>
    <span class="tdiv"></span>
    <input id="projTitle" class="ptitle" spellcheck="false" title="보우타이 제목 (클릭해서 수정)" aria-label="보우타이 제목">
    <span id="saveState" class="savestate"></span>
  </div>
  <nav class="tabs" id="tabs" aria-label="화면 전환">
    <button class="tab on" data-view="diagram" title="다이어그램"><i data-ic="bowtie"></i><span>다이어그램</span></button>
    <button class="tab" data-view="table" title="장벽 목록"><i data-ic="table"></i><span>장벽 목록</span></button>
    <button class="tab" data-view="matrix" title="위험 매트릭스"><i data-ic="grid"></i><span>위험 매트릭스</span></button>
  </nav>
  <div class="tb-right">
    <button class="ibtn" data-cmd="undo" title="실행 취소 (Ctrl+Z)"><i data-ic="undo"></i></button>
    <button class="ibtn" data-cmd="redo" title="다시 실행 (Ctrl+Y)"><i data-ic="redo"></i></button>
    <span class="tdiv"></span>
    <button class="btn lbl" data-cmd="new" title="새로 만들기 · 템플릿"><i data-ic="file-plus"></i><span>새로 만들기</span></button>
    <button class="btn lbl" data-cmd="projects" title="내 프로젝트 목록"><i data-ic="folder"></i><span>프로젝트</span></button>
    <button class="btn lbl" data-cmd="text" title="텍스트로 한 번에 입력"><i data-ic="list"></i><span>텍스트 입력</span></button>
    <button class="btn" data-cmd="exportMenu" title="이미지 · PDF · 엑셀 · 백업"><i data-ic="download"></i><span>내보내기</span></button>
    <button class="btn primary keep" data-cmd="share" title="링크로 공유"><i data-ic="link"></i><span>공유</span></button>
    <span class="tdiv"></span>
    <button class="ibtn" data-cmd="settings" title="설정 (유형·항목·매트릭스·표시)"><i data-ic="sliders"></i></button>
    <button class="ibtn" data-cmd="theme" title="어두운 화면"><i data-ic="moon"></i></button>
    <button class="ibtn" data-cmd="help" title="사용법 (?)"><i data-ic="help"></i></button>
    <button class="ibtn only-narrow" data-cmd="toggleInsp" title="속성 패널"><i data-ic="panel"></i></button>
    <button class="ibtn only-mobile" data-cmd="more" title="더 보기"><i data-ic="more"></i></button>
  </div>
</header>

<main class="main">
  <section class="work">
    <div id="canvas" class="canvas view on" data-view="diagram">
      <div id="stage" class="stage"></div>
      <div class="ctools tl">
        <button class="btn" data-act="addThreat" title="위협 추가 (T)"><i data-ic="plus"></i><span>위협</span></button>
        <button class="btn" data-act="addCons" title="결과 추가 (C)"><i data-ic="plus"></i><span>결과</span></button>
        <div class="sbox"><i data-ic="search"></i><input id="search" class="inp" placeholder="찾기 ( / )" autocomplete="off"><span id="searchCnt" class="scnt"></span></div>
      </div>
      <div class="ctools bl">
        <button class="ibtn" data-act="zoomOut" title="축소 (-)"><i data-ic="zoom-out"></i></button>
        <button class="zoompct" id="zoomPct" data-act="zoom100" title="100%로 (0)">100%</button>
        <button class="ibtn" data-act="zoomIn" title="확대 (+)"><i data-ic="zoom-in"></i></button>
        <button class="ibtn" data-act="fit" title="화면에 맞추기 (F)"><i data-ic="fit"></i></button>
        <button class="ibtn" data-cmd="toggleInsp" title="속성 패널 열기/닫기"><i data-ic="panel"></i></button>
      </div>
      <div class="hint" id="hint"><span class="ht"></span><button class="ibtn" data-act="hideHint" title="도움말 줄 숨기기 (설정에서 다시 켤 수 있음)"><i data-ic="x"></i></button></div>
    </div>
    <div id="tableView" class="view" data-view="table"></div>
    <div id="matrixView" class="view" data-view="matrix"></div>
  </section>
  <div class="insp-backdrop" id="insp-backdrop"></div>
  <aside id="insp" class="insp" aria-label="속성 패널">
    <div class="insp-head" id="insp-head"></div>
    <div class="insp-body" id="insp-body"></div>
  </aside>
</main>

    const pre = side === 'L' ? 'P' : 'M';
    IDX[row.id] = { kind: side === 'L' ? 'threat' : 'cons', obj: row, arr, i, side, num: (side === 'L' ? 'T' : 'C') + (i + 1) };
    row.barriers.forEach((b, j) => {

      IDX[b.id] = { kind: 'barrier', obj: b, arr: row.barriers, i: j, parent: row, line: row, side, num: bn };

/* ---------- 이름 바로 편집 ---------- */

  node.draggable = false; node.classList.add('editing');

      renderDiagram(); renderInspector(); updateHint();
    } else { lab.textContent = e.orig; drawWires(); }

/* ---------- 자동완성 ---------- */
function suggestPool(kind) {
  const seen = new Set(), out = [];
  const add = (name, type) => { const k = String(name || '').trim(); if (!k || seen.has(k)) return; seen.add(k); out.push({ name: k, type }); };
  if (kind === 'barrier' || kind === 'efb') {
    allBarriers().forEach(({ b }) => add(b.name, typeOf(b.type)?.name));
    userLib.forEach(x => add(x.name, x.type));
    if (prefs.useBuiltinLib) LIB_BARRIERS.forEach(s => { const [n, t] = s.split('|'); add(n, t); });
  } else if (kind === 'threat') { P.threats.forEach(t => add(t.name)); LIB_THREATS.forEach(n => add(n)); }
  else if (kind === 'cons') { P.cons.forEach(c => add(c.name)); LIB_CONS.forEach(n => add(n)); }
  else if (kind === 'ef') { allBarriers(false).forEach(({ b }) => b.efs.forEach(e => add(e.name))); LIB_EF.forEach(n => add(n)); }
  return out;
}
function updateSuggest() {
  const e = editing; if (!e) return;
  if (e.kind === 'hazard' || e.kind === 'top') { e.sug = []; paintSuggest(); return; }
  let q = e.lab.textContent.trim(); if (e.isNew && q === e.orig) q = '';
  const ql = normName(q);
  const pool = suggestPool(e.kind).filter(x => x.name !== e.orig);
  const list = ql ? pool.filter(x => normName(x.name).includes(ql) && x.name !== q) : (e.isNew ? pool : []);
  e.sug = list.slice(0, 8); e.si = -1; e.q = q; paintSuggest();
}
function paintSuggest() {
  const box = $('#suggest'), e = editing;
  if (!e || !e.sug.length) { box.classList.remove('on'); return; }
  const hl = s => { const q = (e.q || '').trim(); if (!q) return esc(s); const i = s.indexOf(q); return i < 0 ? esc(s) : esc(s.slice(0, i)) + '<b>' + esc(q) + '</b>' + esc(s.slice(i + q.length)); };
  const tcol = n => { const t = cfg().types.find(x => normName(x.name) === normName(n)); return t ? t.color : 'var(--text3)'; };
  box.innerHTML = `<div class="sg-h">추천 · ↑↓ 고른 뒤 Enter</div>` + e.sug.map((x, i) =>
    `<div class="sg-i${i === e.si ? ' on' : ''}" data-i="${i}"><span>${hl(x.name)}</span>${x.type ? `<em style="color:${tcol(x.type)}">${esc(x.type)}</em>` : ''}</div>`).join('');
  const r = e.lab.getBoundingClientRect();
  box.classList.add('on');
  const bh = box.offsetHeight;
  box.style.left = Math.max(8, Math.min(r.left - 6, innerWidth - box.offsetWidth - 8)) + 'px';
  box.style.top = (r.bottom + 10 + bh > innerHeight ? Math.max(8, r.top - bh - 10) : r.bottom + 10) + 'px';
}
function pickSuggest(i) { const x = editing && editing.sug[i]; if (!x) return; editing.lab.textContent = x.name; editing.picked = x; }
function hideSuggest() { const b = $('#suggest'); if (b) b.classList.remove('on'); }

/* ---------- 키보드 이동 ---------- */
function navigate(m, key) {
  const go = id => { if (id && IDX[id]) select(id, { reveal: true }); };
  const k = m.kind;
  const rowItems = (row, side) => side === 'L' ? [row.id, ...row.barriers.map(b => b.id), 'top'] : ['top', ...row.barriers.map(b => b.id), row.id];
  if (k === 'hazard') { if (key === 'ArrowDown') go('top'); return; }
  if (k === 'top') {
    if (key === 'ArrowUp') go('hazard');
    else if (key === 'ArrowLeft') { const t = P.threats[0]; t && go(t.barriers.length ? t.barriers[t.barriers.length - 1].id : t.id); }
    else if (key === 'ArrowRight') { const c = P.cons[0]; c && go(c.barriers.length ? c.barriers[0].id : c.id); }
    return;
  }
  if (k === 'threat' || k === 'cons' || k === 'barrier') {
    const row = k === 'barrier' ? m.line : m.obj, side = m.side, arr = side === 'L' ? P.threats : P.cons;
    const items = rowItems(row, side), pos = items.indexOf(m.obj.id);
    if (key === 'ArrowLeft' && pos > 0) return go(items[pos - 1]);
    if (key === 'ArrowRight' && pos < items.length - 1) return go(items[pos + 1]);
    if (key === 'ArrowDown' && k === 'barrier' && m.obj.efs.length && prefs.showEF) return go(m.obj.efs[0].id);
    if (key === 'ArrowUp' || key === 'ArrowDown') {
      const r2 = arr[arr.indexOf(row) + (key === 'ArrowUp' ? -1 : 1)]; if (!r2) return;
      if (k !== 'barrier') return go(r2.id);
      const bs = r2.barriers; if (!bs.length) return go(r2.id);
      const fromEnd = row.barriers.length - 1 - m.i;
      return go(side === 'L' ? bs[Math.max(0, bs.length - 1 - fromEnd)].id : bs[Math.min(bs.length - 1, m.i)].id);
    }
    return;
  }
  if (k === 'ef') {
    if (key === 'ArrowUp') return go(m.i > 0 ? m.arr[m.i - 1].id : m.parent.id);
    if (key === 'ArrowDown') return go(m.obj.barriers[0]?.id || m.arr[m.i + 1]?.id);
    return;
  }
  if (k === 'efb') {
    if (key === 'ArrowUp') return go(m.i > 0 ? m.arr[m.i - 1].id : m.parent.id);
    if (key === 'ArrowDown') { const efs = m.barrier.efs, ei = efs.indexOf(m.parent); return go(m.arr[m.i + 1]?.id || efs[ei + 1]?.id); }
  }
}
function altMove(m, key) {
  if (!m.arr) return;
  if (m.kind === 'barrier') { if (key === 'ArrowLeft') moveNode(m.obj.id, -1); if (key === 'ArrowRight') moveNode(m.obj.id, 1); }
  else { if (key === 'ArrowUp') moveNode(m.obj.id, -1); if (key === 'ArrowDown') moveNode(m.obj.id, 1); }
}

/* ---------- 캔버스 이벤트 ---------- */
function bindCanvas() {
  const cv = $('#canvas');
  let pan = null, pinch = null;
  const ptrs = new Map();
  const isUI = t => t.closest('.node, button, input, .ins, .ctools, .hint, [data-act], .add-row');
  cv.addEventListener('pointerdown', e => {
    ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (ptrs.size === 2) {
      const [a, b] = [...ptrs.values()];
      pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), k: view.k }; pan = null; return;
    }
    if (e.button === 1 || (e.button === 0 && !isUI(e.target))) {
      if (e.button === 1) e.preventDefault();
      pan = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false, id: e.pointerId, bg: !isUI(e.target) };
    }
  });
  cv.addEventListener('pointermove', e => {
    if (ptrs.has(e.pointerId)) ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && ptrs.size === 2) {
      const [a, b] = [...ptrs.values()], r = cv.getBoundingClientRect();
      const f = Math.hypot(a.x - b.x, a.y - b.y) / pinch.d;
      zoomAt((pinch.k * f) / view.k, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); return;
    }
    if (!pan || e.pointerId !== pan.id) return;
    const dx = e.clientX - pan.x, dy = e.clientY - pan.y;
    if (!pan.moved && Math.hypot(dx, dy) > 4) { pan.moved = true; cv.classList.add('panning'); try { cv.setPointerCapture(e.pointerId); } catch (_) { } }
    if (pan.moved) { view.x = pan.vx + dx; view.y = pan.vy + dy; applyView(); }
  });
  const end = e => {
    ptrs.delete(e.pointerId);
    if (ptrs.size < 2) pinch = null;
    if (pan && e.pointerId === pan.id) {
      if (!pan.moved && pan.bg && e.type === 'pointerup' && e.button === 0) { if (editing) finishEdit(true); if (SEL) deselect(); closeMenu(); }
      pan = null; cv.classList.remove('panning');
    }
  };
  cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
  cv.addEventListener('wheel', e => {
    if (e.target.closest('.ctools')) return;
    e.preventDefault();
    if (e.ctrlKey || e.metaKey) { const r = cv.getBoundingClientRect(); zoomAt(Math.exp(-e.deltaY * .0022), e.clientX - r.left, e.clientY - r.top); }
    else { view.x -= (e.shiftKey && !e.deltaX) ? e.deltaY : e.deltaX; view.y -= (e.shiftKey && !e.deltaX) ? 0 : e.deltaY; applyView(); }
  }, { passive: false });
  cv.addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act) { runAct(act.dataset.act, act.dataset); return; }
    const tool = e.target.closest('[data-tool]');
    if (tool) { const id = tool.closest('[data-id]').dataset.id; runTool(tool.dataset.tool, id); return; }
    const n = e.target.closest('.node');
    if (n) { if (editing && editing.id === n.dataset.id) return; select(n.dataset.id); }
  });
  cv.addEventListener('dblclick', e => {
    const n = e.target.closest('.node');
    if (n && !e.target.closest('[data-tool]')) { e.preventDefault(); startEdit(n.dataset.id); }
  });
  cv.addEventListener('contextmenu', e => {
    if (e.target.closest('.ctools, .hint')) return;
    e.preventDefault();
    if (editing) finishEdit(true);
    const n = e.target.closest('.node');
    if (n) nodeMenu(n.dataset.id, e.clientX, e.clientY); else bgMenu(e.clientX, e.clientY);
  });
  // 길게 누르기(터치) → 빠른 메뉴
  let lp = null;
  cv.addEventListener('touchstart', e => {
    const n = e.target.closest('.node'); if (!n || e.touches.length > 1) return;
    const t = e.touches[0];
    lp = setTimeout(() => { nodeMenu(n.dataset.id, t.clientX, t.clientY); lp = null; }, 550);
  }, { passive: true });
  ['touchend', 'touchmove', 'touchcancel'].forEach(ev => cv.addEventListener(ev, () => { if (lp) { clearTimeout(lp); lp = null; } }, { passive: true }));
  bindDnD(cv);
}
function runAct(a, ds) {
  switch (a) {
    case 'addThreat': return addNode('threat');
    case 'addCons': return addNode('cons');
    case 'addBarrier': return addNode('barrier', { row: ds.row });
    case 'insBarrier': return addNode('barrier', { row: ds.row, at: +ds.at });
    case 'addEFB': return addNode('efb', { ef: ds.ef });
    case 'zoomIn': return zoomAt(1.2);
    case 'zoomOut': return zoomAt(1 / 1.2);
    case 'zoom100': view.k = 1; return fitCenterKeep();
    case 'fit': return fitView();
    case 'hideHint': prefs.hint = false; savePrefs(); return updateHint();
    case 'searchClear': $('#search').value = ''; return applySearch();

}

let drag = null;
function bindDnD(cv) {
  const clear = () => $$('.drop-before,.drop-after,.drop-above,.drop-below,.drop-into,.drop-row').forEach(x => x.classList.remove('drop-before', 'drop-after', 'drop-above', 'drop-below', 'drop-into', 'drop-row'));
  cv.addEventListener('dragstart', e => {
    const n = e.target.closest && e.target.closest('.node[draggable="true"]');
    if (!n || editing) { e.preventDefault(); return; }
    const m = IDX[n.dataset.id]; if (!m || !m.arr) { e.preventDefault(); return; }
    drag = { id: n.dataset.id, kind: m.kind };
    e.dataTransfer.effectAllowed = 'move';
    try { e.dataTransfer.setData('text/plain', m.obj.name); } catch (_) { }
    setTimeout(() => n.classList.add('dragging'), 0);
    closeMenu();
  });
  cv.addEventListener('dragover', e => {
    if (!drag) return;
    const t = dropTarget(e); clear();
    if (!t) return;
    e.preventDefault(); e.dataTransfer.dropEffect = 'move'; t.el.classList.add(t.cls);
  });
  cv.addEventListener('drop', e => {
    if (!drag) return;
    const t = dropTarget(e); clear();
    if (t) { e.preventDefault(); doDrop(t); }
    drag = null;
  });
  cv.addEventListener('dragend', () => { clear(); $$('.dragging').forEach(x => x.classList.remove('dragging')); drag = null; });
}
function dropTarget(e) {
  if (!drag) return null;
  const dk = drag.kind, node = e.target.closest('.node'), row = e.target.closest('.row');
  const m = node && IDX[node.dataset.id];
  const half = (axis) => { const r = node.getBoundingClientRect(); return axis === 'x' ? e.clientX > r.left + r.width / 2 : e.clientY > r.top + r.height / 2; };
  if (dk === 'barrier') {
    if (m && m.kind === 'barrier') { if (m.obj.id === drag.id) return null; const a = half('x'); return { el: node, cls: a ? 'drop-after' : 'drop-before', act: { type: 'b', row: m.line.id, at: m.i + (a ? 1 : 0) } }; }
    if (m && (m.kind === 'threat' || m.kind === 'cons')) return { el: node, cls: 'drop-into', act: { type: 'b', row: m.obj.id, at: null } };
    if (!m && row) return { el: row, cls: 'drop-row', act: { type: 'b', row: row.dataset.row, at: null } };
  }
  if (dk === 'efb' && m) {
    if (m.kind === 'efb' && m.obj.id !== drag.id) { const a = half('y'); return { el: node, cls: a ? 'drop-below' : 'drop-above', act: { type: 'efb', ef: m.parent.id, at: m.i + (a ? 1 : 0) } }; }
    if (m.kind === 'ef') return { el: node, cls: 'drop-into', act: { type: 'efb', ef: m.obj.id, at: null } };
  }
  if (dk === 'ef' && m && m.kind === 'barrier') return { el: node, cls: 'drop-into', act: { type: 'ef', barrier: m.obj.id } };
  if ((dk === 'threat' || dk === 'cons') && m && m.kind === dk && m.obj.id !== drag.id) {
    const a = half('y'); return { el: node, cls: a ? 'drop-below' : 'drop-above', act: { type: 'row', at: m.i + (a ? 1 : 0) } };
  }
  return null;
}
function doDrop(t) {
  const src = IDX[drag.id]; if (!src) return;
  const a = t.act, item = src.obj, id = drag.id;
  const place = (dest, at) => {
    let i = at == null ? dest.length : at;
    if (dest === src.arr && src.i < i) i--;
    src.arr.splice(src.i, 1); dest.splice(i, 0, item);
  };
  mutate(() => {
    if (a.type === 'b') place(IDX[a.row].obj.barriers, a.at);
    else if (a.type === 'efb') place(IDX[a.ef].obj.barriers, a.at);
    else if (a.type === 'ef') place(IDX[a.barrier].obj.efs, null);
    else if (a.type === 'row') place(src.arr, a.at);
  });
  SEL = id; renderAll();
}

function audit() {
  const W = [];
  if (!P.threats.length) W.push({ lv: 'hi', msg: '위협이 하나도 없습니다' });
  if (!P.cons.length) W.push({ lv: 'hi', msg: '결과가 하나도 없습니다' });
  P.threats.forEach((t, i) => {
    if (!t.barriers.length) W.push({ lv: 'hi', id: t.id, msg: `T${i + 1} "${t.name}" — 예방 장벽 없음` });
    else if (t.barriers.length === 1) W.push({ lv: 'md', id: t.id, msg: `T${i + 1} "${t.name}" — 예방 장벽 1개뿐 (2개 이상 권장)` });
  });
  P.cons.forEach((c, i) => {
    if (!c.barriers.length) W.push({ lv: 'hi', id: c.id, msg: `C${i + 1} "${c.name}" — 완화 장벽 없음` });
    else if (c.barriers.length === 1) W.push({ lv: 'md', id: c.id, msg: `C${i + 1} "${c.name}" — 완화 장벽 1개뿐 (2개 이상 권장)` });
    const r = riskOf(c.s, c.l);
    if (r && r.i >= cfg().matrix.levels.length - 2) W.push({ lv: r.i === cfg().matrix.levels.length - 1 ? 'hi' : 'md', id: c.id, msg: `C${i + 1} "${c.name}" — 위험도 ${r.v} (${r.name})` });
  });
  const all = allBarriers();
  const poor = cfg().effs.length ? cfg().effs[cfg().effs.length - 1] : null;
  all.forEach(({ b }) => {
    const s = stOf(b.status), n = IDX[b.id]?.num || '';
    if (poor && b.eff === poor.id) W.push({ lv: 'md', id: b.id, msg: `${n} "${b.name}" — 효과성 ${poor.name}` });
    if (s && s.style !== 'normal') W.push({ lv: s.style === 'missing' ? 'md' : 'lo', id: b.id, msg: `${n} "${b.name}" — ${s.name}` });
    if (b.critical && !b.owner) W.push({ lv: 'md', id: b.id, msg: `${n} 핵심 장벽 "${b.name}" — 담당 미지정` });
  });
  const noEff = all.filter(x => !effOf(x.b.eff)).length, noOwn = all.filter(x => !x.b.owner).length;
  const efbNote = all.some(x => x.kind === 'efb') ? '(상승요인 대책 포함)' : '';
  if (noEff) W.push({ lv: 'lo', go: 'eff', msg: `효과성 미평가 ${noEff}개${efbNote} — 눌러서 장벽 목록에서 한꺼번에 입력` });
  if (noOwn) W.push({ lv: 'lo', go: 'own', msg: `담당 미지정 ${noOwn}개${efbNote} — 눌러서 목록 보기` });
  const ord = { hi: 0, md: 1, lo: 2 };
  return W.sort((a, b) => ord[a.lv] - ord[b.lv]);
}

/* ================= modals.js : 새로 만들기 · 프로젝트 · 텍스트 입력 · 설정 · 도움말 · 공유 ================= */

/* ---------- 텍스트 개요 ⇄ 보우타이 ---------- */
function parseOutline(text) {
  const R = { hazard: null, top: null, threats: [], cons: [], bad: [] };
  let row = null, b = null, ef = null;
  const reH = /^(위험\s*요인|유해\s*위험\s*요인|hazard)\s*[:：]\s*(.*)$/i;
  const reT = /^(정상\s*사건|중심\s*사건|탑\s*이벤트|top\s*event)\s*[:：]\s*(.*)$/i;
  const reTh = /^(위협|원인|threat)\s*[:：]\s*(.*)$/i;
  const reC = /^(결과|영향|consequence)\s*[:：]\s*(.*)$/i;
  const pb = s => { const f = s.split('|').map(x => x.trim()); return { name: f[0], type: f.length > 1 ? f[1] : undefined, eff: f.length > 2 ? f[2] : undefined, owner: f.length > 3 ? f[3] : undefined, efs: [] }; };
  const lvl = v => { const n = parseInt(v, 10); return Number.isFinite(n) && n > 0 ? n : undefined; };
  String(text || '').split(/\r?\n/).forEach((raw, i) => {
    const line = raw.trim(); let m;
    if (!line || line.startsWith('#') || line.startsWith('//')) return;
    if ((m = line.match(reH))) { R.hazard = m[2].trim(); return; }
    if ((m = line.match(reT))) { R.top = m[2].trim(); return; }
    if ((m = line.match(reTh))) { row = { name: m[2].split('|')[0].trim() || '위협', barriers: [] }; R.threats.push(row); b = ef = null; return; }
    if ((m = line.match(reC))) { const f = m[2].split('|').map(s => s.trim()); row = { name: f[0] || '결과', s: lvl(f[1]), l: lvl(f[2]), barriers: [] }; R.cons.push(row); b = ef = null; return; }
    if ((m = line.match(/^[-–•*]\s*(.+)$/))) { if (!row) { R.bad.push(i + 1); return; } b = pb(m[1]); row.barriers.push(b); ef = null; return; }
    if ((m = line.match(/^!\s*(.+)$/))) { if (!b) { R.bad.push(i + 1); return; } ef = { name: m[1].split('|')[0].trim(), barriers: [] }; b.efs.push(ef); return; }
    if ((m = line.match(/^\+\s*(.+)$/))) { if (!ef) { R.bad.push(i + 1); return; } ef.barriers.push(pb(m[1])); return; }
    R.bad.push(i + 1);
  });
  return R;
}
function toOutline(p = P) {
  const c = p.config, clean = s => String(s || '').replace(/\|/g, '/').replace(/\n/g, ' ');
  const tn = id => (c.types.find(t => t.id === id) || {}).name || '';
  const en = id => (c.effs.find(e => e.id === id) || {}).name || '';
  const bl = (b, pre) => { const f = [clean(b.name), tn(b.type), en(b.eff), clean(b.owner)]; while (f.length > 1 && !f[f.length - 1]) f.pop(); return pre + f.join(' | '); };
  const L = [`위험요인: ${clean(p.hazard.name)}`, `정상사건: ${clean(p.top.name)}`, ''];
  const rows = (arr, label) => arr.forEach(r => {
    const risk = label === '결과' && (r.s || r.l) ? ` | ${r.s || ''} | ${r.l || ''}` : '';
    L.push(`${label}: ${clean(r.name)}${risk}`);
    r.barriers.forEach(b => { L.push(bl(b, '- ')); b.efs.forEach(e => { L.push(`  ! ${clean(e.name)}`); e.barriers.forEach(x => L.push(bl(x, '    + '))); }); });
    L.push('');
  });
  rows(p.threats, '위협'); rows(p.cons, '결과');
  return L.join('\n').trim() + '\n';
}
function applyOutline(p, text, mode = 'replace') {
  const R = parseOutline(text), c = p.config;
  const pool = new Map();
  const remember = b => { const k = b.name; if (!pool.has(k)) pool.set(k, []); pool.get(k).push(b); };
  [...p.threats, ...p.cons].forEach(r => r.barriers.forEach(b => { remember(b); b.efs.forEach(e => e.barriers.forEach(remember)); }));
  const take = n => { const a = pool.get(n); return a && a.length ? a.shift() : null; };
  const mkB = (x, allowEF) => {
    const old = mode === 'replace' ? take(x.name) : null;
    const b = old ? Object.assign(clone(old), { id: uid() }) : mkBarrier(x.name);
    b.name = x.name;
    if (x.type !== undefined) b.type = ensureType(x.type, c);
    if (x.eff !== undefined) b.eff = ensureEff(x.eff, c);
    if (x.owner !== undefined) b.owner = x.owner;
    b.efs = allowEF ? x.efs.map(e => ({ id: uid(), name: e.name, desc: '', barriers: e.barriers.map(y => mkB(y, false)) })) : [];
    return b;
  };
  const oldT = new Map(p.threats.map(t => [t.name, t])), oldC = new Map(p.cons.map(x => [x.name, x]));
  const threats = R.threats.map(t => { const o = mode === 'replace' ? oldT.get(t.name) : null; return { id: uid(), name: t.name, desc: o ? o.desc : '', barriers: t.barriers.map(b => mkB(b, true)) }; });
  const n = c.matrix.size, cl = v => v ? Math.min(n, v) : 0;
  const cons = R.cons.map(x => {
    const o = mode === 'replace' ? oldC.get(x.name) : null;
    return { id: uid(), name: x.name, desc: o ? o.desc : '', s: x.s !== undefined ? cl(x.s) : (o ? o.s : 0), l: x.l !== undefined ? cl(x.l) : (o ? o.l : 0), s2: o ? o.s2 : 0, l2: o ? o.l2 : 0, barriers: x.barriers.map(b => mkB(b, true)) };
  });
  if (mode === 'replace') { p.threats = threats; p.cons = cons; }
  else { p.threats.push(...threats); p.cons.push(...cons); }
  if (R.hazard) p.hazard.name = R.hazard;
  if (R.top) p.top.name = R.top;
  return R;
}

    }).join('')}</div>

function bindSettings(box, paint) {
  const c = () => cfg();
  const after = () => { renderAll(); };
  const fixLevels = () => {
    const mt = c().matrix, n = mt.size; let ok = true;
    mt.levels.forEach((lv, i) => { if (i > 0 && lv.max <= mt.levels[i - 1].max) ok = false; });
    mt.levels[mt.levels.length - 1].max = n * n;
    const w = $('#lvWarn', box); if (w) w.textContent = ok ? '' : '⚠ 등급의 최댓값은 위 등급보다 커야 합니다 (예: 4, 9, 14, 25).';
    $$('[data-range]', box).forEach(s => s.textContent = levelRange(+s.dataset.range, mt));
  };
  box.addEventListener('input', e => {
    const t = e.target, row = t.closest('.srow'), list = t.closest('[data-list]')?.dataset.list;
    if (list && row && t.dataset.k && t.type !== 'checkbox' && t.tagName !== 'SELECT') {
      const i = +row.dataset.i, k = t.dataset.k;
      mutate(() => { const it = c()[list][i]; it[k] = k === 'options' ? t.value.split(',').map(s => s.trim()).filter(Boolean) : t.value; }, { key: `set:${list}:${i}:${k}` });
      after(); return;
    }
    if (t.dataset.mlab) { mutate(() => { c().matrix[t.dataset.mlab][+t.dataset.i] = t.value; }, { key: 'mlab' + t.dataset.mlab + t.dataset.i }); after(); return; }
    if (t.dataset.lv) {
      const i = +t.dataset.i, k = t.dataset.lv;
      mutate(() => { const lv = c().matrix.levels[i]; lv[k] = k === 'max' ? Math.max(1, Math.round(+t.value || 1)) : t.value; }, { key: `lv:${i}:${k}` });
      fixLevels(); after(); return;
    }
    if (t.id === 'libTa') {
      userLib = t.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => { const [n, ty] = l.split('|').map(s => s.trim()); return { name: n, type: ty || '' }; });
      lsSet(LS.lib, userLib);
    }
  });
  box.addEventListener('change', e => {
    const t = e.target, row = t.closest('.srow'), list = t.closest('[data-list]')?.dataset.list;
    if (list && row && t.dataset.k && (t.type === 'checkbox' || t.tagName === 'SELECT')) {
      const i = +row.dataset.i, k = t.dataset.k;
      mutate(() => { c()[list][i][k] = t.type === 'checkbox' ? t.checked : t.value; });
      after(); if (k === 'kind') paint(); return;
    }
    if (t.dataset.pref) { prefs[t.dataset.pref] = t.checked; savePrefs(); after(); updateHint(); requestAnimationFrame(drawWires); }
  });
  box.addEventListener('click', async e => {
    const t = e.target;
    const add = t.closest('[data-add]');
    if (add) {
      const list = add.dataset.add;
      mutate(() => {
        const L = c()[list];
        if (list === 'types') L.push({ id: uid(), name: '새 유형', color: nextColor(L) });
        if (list === 'effs') L.push({ id: uid(), name: '새 등급', color: nextColor(L) });
        if (list === 'statuses') L.push({ id: uid(), name: '새 상태', style: 'normal' });
        if (list === 'fields') L.push({ id: uid(), name: '새 항목', kind: 'text', options: [], onCard: false });
      });
      paint(); after();
      const inps = $$(`[data-list="${list}"] .srow:last-child [data-k="name"]`, box); if (inps[0]) { inps[0].focus(); inps[0].select(); }
      return;
    }
    const q = t.closest('[data-quick]');
    if (q) {
      const name = q.dataset.quick, kind = /일|기한/.test(name) ? 'date' : /비|만원/.test(name) ? 'number' : 'text';
      if (c().fields.some(f => f.name === name)) { toast('이미 있는 항목입니다'); return; }
      mutate(() => c().fields.push({ id: uid(), name, kind, options: [], onCard: false })); paint(); after(); return;
    }
    const mv = t.closest('[data-mv]');
    if (mv) {
      const list = mv.closest('[data-list]').dataset.list, i = +mv.closest('.srow').dataset.i, j = i + (+mv.dataset.mv);
      mutate(() => { const L = c()[list]; const [x] = L.splice(i, 1); L.splice(j, 0, x); }); paint(); after(); return;
    }
    const del = t.closest('[data-del]');
    if (del) {
      const list = del.closest('[data-list]').dataset.list, i = +del.closest('.srow').dataset.i, it = c()[list][i], n = useCount(list, it.id);
      if (n && !await confirmBox(`'<b>${esc(it.name)}</b>'은(는) 장벽 ${n}개에서 쓰고 있습니다.<br>삭제하면 해당 장벽에서는 ${list === 'fields' ? '입력값이 지워집니다' : '미지정으로 바뀝니다'}.`, { ok: '삭제', danger: true })) return;
      mutate(() => {
        c()[list].splice(i, 1);
        allBarriers().forEach(({ b }) => {
          if (list === 'types' && b.type === it.id) b.type = '';
          if (list === 'effs' && b.eff === it.id) b.eff = '';
          if (list === 'statuses' && b.status === it.id) b.status = '';
          if (list === 'fields' && b.cf) delete b.cf[it.id];
        });
      });
      paint(); after(); return;
    }
    const ms = t.closest('[data-msize]');
    if (ms) {
      const n = +ms.dataset.msize; if (n === c().matrix.size) return;
      mutate(() => { c().matrix = defaultMatrix(n); P.cons.forEach(x => ['s', 'l', 's2', 'l2'].forEach(f => { if (x[f] > n) x[f] = n; })); });
      paint(); after(); return;
    }
    const ns = t.closest('[data-ns]'); if (ns) { prefs.nodeSize = ns.dataset.ns; savePrefs(); paint(); after(); requestAnimationFrame(drawWires); return; }
    const th = t.closest('[data-theme-set]'); if (th) { prefs.theme = th.dataset.themeSet; savePrefs(); applyTheme(); paint(); return; }
    const da = t.closest('[data-da]');
    if (da) {
      const a = da.dataset.da;
      if (a === 'saveDef') { lsSet(LS.defaults, cfg()); toast('기본값으로 저장했습니다. 새로 만드는 보우타이에 적용됩니다'); }
      if (a === 'resetDef') { lsDel(LS.defaults); toast('기본값을 처음 상태로 되돌렸습니다'); }
      if (a === 'json') exportJSON();
      if (a === 'import') $('#fileIn').click();
      if (a === 'allJson') {
        const all = lsGet(LS.index, []).map(x => lsGet(LS.proj(x.id))).filter(Boolean);
        download(`보우타이_전체백업_${today()}.json`, JSON.stringify({ app: APP_ID, kind: 'all', projects: all }, null, 2), 'application/json');
      }
      if (a === 'wipe') {
        if (!await confirmBox('이 브라우저에 저장된 <b>모든 보우타이와 설정</b>을 지울까요?<br>되돌릴 수 없습니다.', { ok: '모두 지우기', danger: true })) return;
        Object.keys(localStorage).filter(k => k.startsWith('btw.')).forEach(lsDel);
        location.reload();
      }
    }
  });
}

/* ================= main.js : 화면 전환 · 상단 메뉴 · 단축키 · 시작 ================= */
function renderAll() {
  if (!P) return;
  const t = $('#projTitle'); if (t && document.activeElement !== t) t.value = P.meta.title;
  document.title = `${P.meta.title || '보우타이'} · BowTie 분석기`;
  if (VIEW === 'diagram') renderDiagram(); else rerenderView();
  renderInspector(); updateUndoUI(); updateHint();
}
function setView(v) {
  if (editing) finishEdit(true);
  closeMenu();
  VIEW = v;
  $$('.view').forEach(el => el.classList.toggle('on', el.dataset.view === v));
  $$('#tabs .tab').forEach(b => b.classList.toggle('on', b.dataset.view === v));
  renderAll();
  if (v === 'diagram') requestAnimationFrame(() => { drawWires(); applyView(); });
}
function applyTheme() {
  document.documentElement.dataset.theme = prefs.theme;
  const b = $('[data-cmd="theme"]'); if (b) { b.innerHTML = ic(prefs.theme === 'dark' ? 'sun' : 'moon'); b.title = prefs.theme === 'dark' ? '밝은 화면' : '어두운 화면'; }
  const mc = $('meta[name="theme-color"]'); if (mc) mc.content = prefs.theme === 'dark' ? '#13171d' : '#ffffff';
}
function toggleInsp() {
  if (innerWidth <= 900) { document.body.classList.toggle('insp-open'); return; }
  prefs.inspector = !prefs.inspector; savePrefs();
  document.body.classList.toggle('insp-off', !prefs.inspector);
  requestAnimationFrame(() => { drawWires(); });
}
const CMD = {
  undo, redo, new: openNew, projects: openProjects, text: openText, share: openShare, help: openHelp,
  settings: () => openSettings(), exportMenu: btn => openExportMenu(btn), toggleInsp,
  theme: () => { prefs.theme = prefs.theme === 'dark' ? 'light' : 'dark'; savePrefs(); applyTheme(); },
  more: btn => {
    const r = btn.getBoundingClientRect();
    openMenu(r.right - 240, r.bottom + 6, [
      { icon: 'redo', label: '다시 실행', run: redo, disabled: !H.future.length },
      { icon: 'folder', label: '내 프로젝트', run: openProjects },
      { icon: 'list', label: '텍스트로 한 번에 입력', run: openText },
      { icon: 'sliders', label: '설정', run: () => openSettings() },
      { icon: prefs.theme === 'dark' ? 'sun' : 'moon', label: prefs.theme === 'dark' ? '밝은 화면' : '어두운 화면', run: CMD.theme },
      { icon: 'help', label: '사용법', run: openHelp }
    ]);
  }
};
function bindTop() {
  document.body.addEventListener('click', e => {
    const b = e.target.closest('[data-cmd]'); if (!b || b.disabled) return;
    const f = CMD[b.dataset.cmd]; if (f) { e.stopPropagation(); f(b); }
  });
  $('#tabs').addEventListener('click', e => { const t = e.target.closest('.tab'); if (t) setView(t.dataset.view); });
  const ti = $('#projTitle');
  ti.addEventListener('input', () => {
    mutate(() => { P.meta.title = ti.value; }, { key: 'meta:title' });
    document.title = `${P.meta.title || '보우타이'} · BowTie 분석기`;
    if (VIEW === 'diagram' && prefs.showTitle) renderDiagram();
    if (!SEL) { const mi = $('#insp [data-meta="title"]'); if (mi) mi.value = ti.value; }
  });
  ti.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) ti.blur(); });
  const s = $('#search');
  s.addEventListener('input', () => applySearch());
  s.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') { e.preventDefault(); searchNext(); }
    if (e.key === 'Escape') { s.value = ''; applySearch(); s.blur(); }
  });
  $('#fileIn').addEventListener('change', e => { const f = e.target.files[0]; e.target.value = ''; importFile(f); });
  $('#suggest').addEventListener('mousedown', e => {
    e.preventDefault();

    pickSuggest(+it.dataset.i); finishEdit(true);
  });
  document.addEventListener('mousedown', e => { if (!e.target.closest('#ctx')) closeMenu(); });
  window.addEventListener('blur', closeMenu);
  $('#insp-backdrop').addEventListener('click', () => document.body.classList.remove('insp-open'));
}
function bindGlobalKeys() {
  document.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;
    const t = e.target, mod = e.ctrlKey || e.metaKey, code = e.code;
    const inField = t.closest && t.closest('input, textarea, select, [contenteditable="true"]');
    if (modalStack.length) {
      if (e.key === 'Escape') { e.preventDefault(); modalStack[modalStack.length - 1].close(); }
      return;
    }
    if (e.key === 'Escape' && $('#ctx').classList.contains('on')) { closeMenu(); return; }
    if (mod && code === 'KeyS') { e.preventDefault(); if (editing) finishEdit(true); saveNow(true); return; }
    if (editing) return;
    if (inField) { if (e.key === 'Escape' && t.blur) t.blur(); return; }
    if (mod && code === 'KeyZ') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
    if (mod && code === 'KeyY') { e.preventDefault(); redo(); return; }
    if (mod && code === 'KeyD') { e.preventDefault(); if (SEL) dupNode(SEL); return; }
    if (mod || e.altKey && !e.key.startsWith('Arrow')) return;
    if (e.key === '?' || (code === 'Slash' && e.shiftKey)) { e.preventDefault(); openHelp(); return; }
    if (e.key === 'Escape') { if (SEL) deselect(); document.body.classList.remove('insp-open'); return; }
    if (VIEW !== 'diagram') return;
    if (code === 'Slash') { e.preventDefault(); $('#search').focus(); return; }
    if (code === 'KeyF' && !e.shiftKey) { fitView(); return; }
    if (code === 'Digit0') { view.k = 1; fitCenterKeep(); return; }
    if (e.key === '+' || e.key === '=') { zoomAt(1.2); return; }
    if (e.key === '-') { zoomAt(1 / 1.2); return; }
    if (code === 'KeyT') { e.preventDefault(); addNode('threat'); return; }
    if (code === 'KeyC') { e.preventDefault(); addNode('cons'); return; }
    const m = SEL && IDX[SEL];
    if (!m) { if (e.key.startsWith('Arrow')) { e.preventDefault(); select('top', { reveal: true }); } return; }
    if (e.key === 'Enter' && e.shiftKey) { e.preventDefault(); addSibling(SEL); return; }
    if (e.key === 'Enter' || e.key === 'F2') { e.preventDefault(); startEdit(SEL); return; }
    if (e.key === 'Tab') { e.preventDefault(); addChild(SEL); return; }
    if (e.key === 'Insert') { e.preventDefault(); addSibling(SEL); return; }
    if (e.key === 'Delete' || e.key === 'Backspace') { e.preventDefault(); deleteNode(SEL); return; }
    if (code === 'KeyB') {
      e.preventDefault();
      const row = (m.kind === 'threat' || m.kind === 'cons') ? SEL : (m.kind === 'barrier' ? m.line.id : null);
      if (row) addNode('barrier', { row, at: m.kind === 'barrier' ? m.i + 1 : undefined });
      return;
    }
    if (code === 'KeyE') { e.preventDefault(); if (m.kind === 'barrier') addNode('ef', { barrier: SEL }); return; }
    if (e.key.startsWith('Arrow')) { e.preventDefault(); if (e.altKey) altMove(m, e.key); else navigate(m, e.key); }
  });
}
function bindFileDrop() {
  const dz = $('#dropzone'); let n = 0;
  const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files');
  window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; n++; dz.classList.add('on'); });
  window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; n = Math.max(0, n - 1); if (!n) dz.classList.remove('on'); });
  window.addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
  window.addEventListener('drop', e => {
    if (!hasFiles(e)) return;
    e.preventDefault(); n = 0; dz.classList.remove('on');

  });
}

}
document.addEventListener('DOMContentLoaded', init);
